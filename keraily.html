<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>TT Keräily</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #22223a;
    --border: #2e2e4a;
    --accent: #f5a623;
    --accent2: #e8451a;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f39c12;
    --text: #e8e8f0;
    --muted: #7a7a9a;
    --mono: 'Courier New', monospace;
    --sans: system-ui, -apple-system, sans-serif;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  header .logo { color: var(--accent); font-weight: 900; font-size: 20px; letter-spacing: -1px; }
  .badge {
    margin-left: auto; font-size: 11px; font-weight: 700;
    background: var(--accent); color: #000;
    padding: 2px 8px; border-radius: 20px;
  }

  /* ── NAV TABS ── */
  nav {
    display: flex; background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  nav button {
    flex: 1; padding: 12px 4px; background: none; border: none;
    color: var(--muted); font-size: 12px; font-weight: 600;
    cursor: pointer; border-bottom: 3px solid transparent;
    transition: all .15s; letter-spacing: .3px;
    text-transform: uppercase;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── PAGES ── */
  .page { display: none; flex: 1; overflow-y: auto; padding: 16px; }
  .page.active { display: block; }

  /* ── CARDS ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }

  /* ── INPUTS ── */
  input[type=text], input[type=number], select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; color: var(--text);
    font-size: 16px; font-family: var(--sans); outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=number] { font-family: var(--mono); }
  label { display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }

  /* ── BUTTONS ── */
  .btn {
    display: block; width: 100%; padding: 14px;
    border: none; border-radius: 8px; font-size: 15px;
    font-weight: 700; cursor: pointer; transition: opacity .15s;
    letter-spacing: .3px; text-align: center;
  }
  .btn:active { opacity: .8; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-success { background: var(--green); color: #000; }
  .btn-sm {
    display: inline-block; width: auto; padding: 6px 14px;
    font-size: 12px; border-radius: 6px;
  }
  .btn + .btn { margin-top: 8px; }
  .btn-icon { font-size: 18px; margin-right: 6px; }

  /* ── SCAN BUTTON ── */
  .scan-row { display: flex; gap: 8px; }
  .scan-row input { flex: 1; }
  .btn-scan {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 0 14px; font-size: 22px;
    cursor: pointer; flex-shrink: 0; color: var(--accent);
  }

  /* ── STATUS TAGS ── */
  .tag {
    display: inline-block; font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px; letter-spacing: .5px;
  }
  .tag-ok { background: rgba(46,204,113,.15); color: var(--green); }
  .tag-wait { background: rgba(243,156,18,.15); color: var(--yellow); }
  .tag-err { background: rgba(231,76,60,.15); color: var(--red); }

  /* ── SHELF ROW ── */
  .shelf-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .shelf-row:last-child { border-bottom: none; }
  .shelf-code {
    font-family: var(--mono); font-size: 15px; font-weight: 700;
    color: var(--accent); min-width: 70px;
  }
  .shelf-qty {
    font-family: var(--mono); font-size: 20px; font-weight: 900;
    color: var(--text); min-width: 40px; text-align: right;
  }
  .shelf-unit { font-size: 11px; color: var(--muted); }
  .shelf-actions { margin-left: auto; display: flex; gap: 6px; }

  /* ── PRODUCT RESULT ── */
  .product-card {
    background: var(--surface2); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .product-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .product-code { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .total-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.3);
    border-radius: 6px; padding: 6px 12px; margin-bottom: 12px;
    font-family: var(--mono); font-size: 18px; font-weight: 900; color: var(--accent);
  }
  .total-badge span { font-size: 11px; font-weight: 600; color: var(--muted); }

  /* ── PICKING LIST ── */
  .pick-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
    transition: border-color .2s;
  }
  .pick-row.done { opacity: .5; }
  .pick-row.active-pick { border-color: var(--accent); }
  .pick-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pick-num { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .pick-name { font-size: 14px; font-weight: 700; flex: 1; }
  .pick-location { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .pick-qty-row { display: flex; align-items: center; gap: 8px; }
  .qty-needed { font-family: var(--mono); font-size: 22px; font-weight: 900; }
  .qty-label { font-size: 11px; color: var(--muted); }
  .multi-shelf { margin-top: 8px; }
  .multi-shelf-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px;
    background: var(--surface2); margin-bottom: 4px;
  }
  .multi-shelf-row .shelf-code { font-size: 13px; min-width: 60px; }
  .multi-shelf-row .shelf-qty { font-size: 15px; min-width: 30px; }

  /* ── PICKING CONFIRM OVERLAY ── */
  .confirm-box {
    background: var(--surface2); border: 2px solid var(--accent);
    border-radius: var(--radius); padding: 16px; margin-top: 10px;
  }
  .confirm-box .step { font-size: 11px; color: var(--muted); margin-bottom: 8px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .confirm-result {
    font-size: 14px; font-weight: 700; padding: 10px;
    border-radius: 8px; text-align: center; margin-bottom: 10px;
  }
  .confirm-result.ok { background: rgba(46,204,113,.2); color: var(--green); }
  .confirm-result.err { background: rgba(231,76,60,.2); color: var(--red); }

  /* ── REGISTER LIST ── */
  .reg-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
  }
  .reg-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .reg-code { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 10px; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 20px; font-size: 14px;
    font-weight: 600; display: none; z-index: 999; white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  #toast.show { display: block; }
  #toast.ok { border-color: var(--green); color: var(--green); }
  #toast.err { border-color: var(--red); color: var(--red); }

  /* ── SCANNER MODAL ── */
  #scanner-modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: #000; flex-direction: column;
  }
  #scanner-modal.active { display: flex; }
  #scanner-video { width: 100%; flex: 1; object-fit: cover; }
  .scanner-ui {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .scanner-frame {
    width: 240px; height: 160px; border: 2px solid var(--accent);
    border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,.6);
    position: relative;
  }
  .scanner-line {
    position: absolute; left: 0; right: 0; height: 2px;
    background: var(--accent); animation: scan 2s linear infinite;
  }
  @keyframes scan { 0%{top:0} 50%{top:calc(100% - 2px)} 100%{top:0} }
  .scanner-label {
    color: #fff; font-size: 14px; font-weight: 600;
    margin-top: 20px; text-align: center; pointer-events: none;
  }
  .scanner-hint { color: rgba(255,255,255,.6); font-size: 12px; margin-top: 6px; }
  #scanner-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,.1); border: none; color: #fff;
    font-size: 24px; width: 44px; height: 44px; border-radius: 22px;
    cursor: pointer; pointer-events: all; display: flex;
    align-items: center; justify-content: center;
  }
  #scanner-manual {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3);
    color: #fff; border-radius: 8px; padding: 10px 24px;
    font-size: 14px; cursor: pointer; pointer-events: all;
  }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; line-height: 1.5; }

  /* ── DIVIDER ── */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ── SEARCH ── */
  .search-wrap { margin-bottom: 12px; position: relative; }
  .search-wrap input { padding-left: 40px; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">TT</div>
    <h1>Keräily</h1>
    <div class="badge" id="header-badge" style="display:none"></div>
  </header>

  <nav>
    <button class="active" onclick="showPage('hyllytys')">📥 Hyllytys</button>
    <button onclick="showPage('keraily')">📋 Keräily</button>
    <button onclick="showPage('rekisteri')">🗂 Rekisteri</button>
  </nav>

  <!-- ═══════════════════════════════════ HYLLYTYS ═══ -->
  <div id="page-hyllytys" class="page active">

    <div class="card">
      <div class="card-title">1. Hae tuote</div>
      <label>EAN-viivakoodi tai tuotekoodi</label>
      <div class="scan-row">
        <input type="text" id="hyl-ean" placeholder="Skannaa tai kirjoita..." autocomplete="off">
        <button class="btn-scan" onclick="openScanner('hyl-ean', 'Skannaa tuotteen EAN')">⊡</button>
      </div>
      <div style="margin-top:8px">
        <button class="btn btn-secondary" onclick="searchProduct()">🔍 Hae</button>
      </div>
    </div>

    <div id="hyl-product-result" style="display:none"></div>

    <div id="hyl-form" style="display:none">
      <div class="card">
        <div class="card-title">2. Hyllypaikka ja määrä</div>
        <label>Hyllypaikka</label>
        <div class="scan-row">
          <input type="text" id="hyl-shelf" placeholder="Skannaa QR tai kirjoita (esim. B3-04)" autocomplete="off" style="text-transform:uppercase">
          <button class="btn-scan" onclick="openScanner('hyl-shelf', 'Skannaa hyllypaikan QR')">⊡</button>
        </div>
        <div style="margin-top:12px">
          <label>Määrä (kpl)</label>
          <input type="number" id="hyl-qty" placeholder="0" min="0" value="1">
        </div>
        <div style="margin-top:12px">
          <button class="btn btn-primary" onclick="saveShelfEntry()">
            <span class="btn-icon">✓</span> Tallenna hyllytys
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- ═══════════════════════════════════ KERÄILY ═══ -->
  <div id="page-keraily" class="page">

    <div id="pick-setup" class="card">
      <div class="card-title">Uusi keräilylista</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px">
        Skannaa tuotteet keräyslähetteeltä. Sovellus näyttää hyllypaikat.
      </p>
      <button class="btn btn-primary" onclick="startNewList()">
        <span class="btn-icon">＋</span> Aloita uusi lista
      </button>
    </div>

    <div id="pick-active" style="display:none">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <div style="flex:1;font-size:13px;color:var(--muted)" id="pick-progress-label"></div>
        <button class="btn btn-secondary btn-sm" onclick="clearPickList()" style="color:var(--red)">✕ Lopeta</button>
      </div>

      <!-- Add item to list -->
      <div class="card" id="pick-add-card">
        <div class="card-title">Lisää rivi listaan</div>
        <div class="scan-row">
          <input type="text" id="pick-ean" placeholder="Skannaa EAN lähetteeltä..." autocomplete="off">
          <button class="btn-scan" onclick="openScanner('pick-ean', 'Skannaa EAN lähetteeltä')">⊡</button>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px">
          <div style="flex:1">
            <label>Määrä</label>
            <input type="number" id="pick-need-qty" placeholder="1" min="1" value="1">
          </div>
          <div style="flex:0;display:flex;align-items:flex-end">
            <button class="btn btn-primary" style="white-space:nowrap" onclick="addPickRow()">＋ Lisää</button>
          </div>
        </div>
      </div>

      <!-- Pick rows -->
      <div id="pick-rows"></div>

      <div id="pick-confirm-area" style="display:none">
        <div class="card">
          <div class="card-title">Vahvista keräily</div>
          <div id="pick-confirm-inner"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ═══════════════════════════════════ REKISTERI ═══ -->
  <div id="page-rekisteri" class="page">

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="reg-search" placeholder="Hae nimikkeellä, koodilla tai hyllyllä..."
        oninput="renderRegistry()">
    </div>

    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-secondary btn-sm" onclick="exportCSV()">⬇ Vie CSV</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('import-csv').click()">⬆ Tuo CSV</button>
      <input type="file" id="import-csv" accept=".csv" style="display:none" onchange="importCSV(event)">
    </div>

    <div id="registry-list"></div>
  </div>

</div>

<!-- ═══════════════════════════════════ SCANNER MODAL ═══ -->
<div id="scanner-modal">
  <div id="scanner-qr-box"></div>
  <div class="scanner-ui" style="pointer-events:none">
    <div class="scanner-label" id="scanner-label-text" style="margin-top:0;position:absolute;top:20px;left:0;right:0;text-align:center">Skannaa viivakoodi</div>
    <!-- Tähtäysviiva 1D-viivakoodille -->
    <div style="position:absolute;top:50%;left:10%;right:10%;height:2px;background:rgba(245,166,35,0.8);box-shadow:0 0 8px rgba(245,166,35,0.8);transform:translateY(-50%);"></div>
    <div style="position:absolute;top:50%;left:10%;right:10%;height:80px;border:2px solid rgba(245,166,35,0.5);transform:translateY(-50%);border-radius:4px;"></div>
    <div class="scanner-hint" style="position:absolute;bottom:100px;left:0;right:0;text-align:center">Pidä viivakoodi vaakasuoraan kehyksen sisällä</div>
  </div>
  <button id="scanner-close" onclick="closeScanner()">✕</button>
  <button id="scanner-manual" onclick="manualInput()">Kirjoita käsin</button>
</div>

<div id="toast"></div>


<script>
// ─── DB ───────────────────────────────────────────────────────────────────────
// Structure:
// products[ean] = { ean, code, name }
// shelves[ean][shelfCode] = qty
// pickList = [ { ean, name, code, needed, shelves:[{code,available,toTake}], done } ]

const DB = {
  get: k => JSON.parse(localStorage.getItem('tt_' + k) || 'null'),
  set: (k, v) => localStorage.setItem('tt_' + k, JSON.stringify(v)),
  getProducts: () => DB.get('products') || {},
  getShelves: () => DB.get('shelves') || {},
  getPickList: () => DB.get('picklist') || [],
  // codeIndex: { tuotekoodi_uppercase -> ean } — nopea haku tuotekoodilla
  getCodeIndex: () => DB.get('codeindex') || {},
  saveProducts: v => DB.set('products', v),
  saveShelves: v => DB.set('shelves', v),
  savePickList: v => DB.set('picklist', v),
  saveCodeIndex: v => DB.set('codeindex', v),
  // Hae tuote joko EAN:lla tai tuotekoodilla — palauttaa { ean, product } tai null
  findProduct(query) {
    const q = query.trim();
    const products = DB.getProducts();
    // 1. Suora EAN-osuma
    if (products[q]) return { ean: q, product: products[q] };
    // 2. Tuotekoodi-indeksi
    const idx = DB.getCodeIndex();
    const ean = idx[q.toUpperCase()];
    if (ean && products[ean]) return { ean, product: products[ean] };
    // 3. Brute-force fallback (kattaa vanhat tietueet ilman indeksiä)
    const found = Object.values(products).find(p =>
      p.code && p.code.toUpperCase() === q.toUpperCase()
    );
    if (found) return { ean: found.ean, product: found };
    return null;
  },
  // Tallenna tuote ja päivitä koodi-indeksi
  saveProduct(ean, product) {
    const products = DB.getProducts();
    // Poista vanhan koodin indeksiviite jos koodi muuttui
    const old = products[ean];
    const idx = DB.getCodeIndex();
    if (old && old.code) delete idx[old.code.toUpperCase()];
    products[ean] = product;
    if (product.code) idx[product.code.toUpperCase()] = ean;
    DB.saveProducts(products);
    DB.saveCodeIndex(idx);
  },
  // Poista tuote ja sen indeksiviite
  deleteProduct(ean) {
    const products = DB.getProducts();
    const p = products[ean];
    if (p && p.code) {
      const idx = DB.getCodeIndex();
      delete idx[p.code.toUpperCase()];
      DB.saveCodeIndex(idx);
    }
    delete products[ean];
    const shelves = DB.getShelves();
    delete shelves[ean];
    DB.saveProducts(products);
    DB.saveShelves(shelves);
  },
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => el.className = '', 2500);
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'rekisteri') renderRegistry();
  if (name === 'keraily') renderPickRows();
  updateBadge();
}

function updateBadge() {
  const list = DB.getPickList();
  const badge = document.getElementById('header-badge');
  if (list.length > 0) {
    const done = list.filter(r => r.done).length;
    badge.textContent = done + '/' + list.length;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

function getProductTotal(ean) {
  const shelves = DB.getShelves();
  if (!shelves[ean]) return 0;
  return Object.values(shelves[ean]).reduce((a, b) => a + b, 0);
}

// ─── SCANNER ─────────────────────────────────────────────────────────────────
// Käyttää BarcodeDetector API:a (natiivi Android Chrome) tai kuvakaappausta
let scanTarget = null;
let scanCallback = null;
let scanStream = null;
let scanAnimFrame = null;
let scanVideo = null;

function openScanner(targetId, label, callback) {
  scanTarget = targetId;
  scanCallback = callback || null;
  document.getElementById('scanner-label-text').textContent = label || 'Skannaa viivakoodi';
  document.getElementById('scanner-modal').classList.add('active');
  startCamera();
}

async function startCamera() {
  const box = document.getElementById('scanner-qr-box');
  box.innerHTML = '';

  // Luo video-elementti
  const video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.setAttribute('autoplay', '');
  video.setAttribute('muted', '');
  video.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
  box.appendChild(video);
  scanVideo = video;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 },
      }
    });
    scanStream = stream;
    video.srcObject = stream;
    await video.play();

    // BarcodeDetector — natiivi Android Chrome 83+
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({
        formats: ['code_128','ean_13','ean_8','code_39','itf','upc_a','upc_e','qr_code','data_matrix']
      });
      detectLoop(detector, video);
    } else {
      // Fallback: canvas + kuvakaappaus-nappi
      showManualCaptureUI(video);
    }
  } catch(e) {
    console.error('Camera error:', e);
    closeScanner();
    toast('Kamera ei käytettävissä — kirjoita käsin', 'err');
  }
}

function detectLoop(detector, video) {
  if (!scanStream) return; // scanner suljettu
  detector.detect(video).then(barcodes => {
    if (!scanStream) return;
    if (barcodes.length > 0) {
      const code = barcodes[0].rawValue;
      if (code) {
        closeScanner();
        handleScan(code);
        return;
      }
    }
    scanAnimFrame = requestAnimationFrame(() => detectLoop(detector, video));
  }).catch(() => {
    if (scanStream) scanAnimFrame = requestAnimationFrame(() => detectLoop(detector, video));
  });
}

function showManualCaptureUI(video) {
  // BarcodeDetector ei tuettu — näytä nappi jolla otetaan kuva ja yritetään lukea
  const box = document.getElementById('scanner-qr-box');
  const btn = document.createElement('button');
  btn.textContent = '📷 Lue viivakoodi';
  btn.style.cssText = `position:absolute;bottom:150px;left:50%;transform:translateX(-50%);
    background:#f5a623;color:#000;border:none;border-radius:8px;padding:14px 28px;
    font-size:16px;font-weight:700;cursor:pointer;z-index:10;`;
  btn.onclick = captureAndDecode;
  box.appendChild(btn);

  const note = document.createElement('div');
  note.textContent = 'BarcodeDetector ei tuettu — kirjoita koodi käsin';
  note.style.cssText = 'position:absolute;bottom:120px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.6);font-size:12px;';
  box.appendChild(note);
}

async function captureAndDecode() {
  if (!scanVideo) return;
  const canvas = document.createElement('canvas');
  canvas.width = scanVideo.videoWidth;
  canvas.height = scanVideo.videoHeight;
  canvas.getContext('2d').drawImage(scanVideo, 0, 0);
  // BarcodeDetector kuvan perusteella
  if ('BarcodeDetector' in window) {
    try {
      const detector = new BarcodeDetector();
      const barcodes = await detector.detect(canvas);
      if (barcodes.length > 0) {
        closeScanner();
        handleScan(barcodes[0].rawValue);
        return;
      }
    } catch(e) {}
  }
  toast('Ei luettu — kirjoita käsin', 'err');
}

function closeScanner() {
  document.getElementById('scanner-modal').classList.remove('active');
  if (scanAnimFrame) { cancelAnimationFrame(scanAnimFrame); scanAnimFrame = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  scanVideo = null;
  const box = document.getElementById('scanner-qr-box');
  if (box) box.innerHTML = '';
}

function manualInput() {
  closeScanner();
  const val = prompt('Kirjoita koodi:');
  if (val && val.trim()) handleScan(val.trim());
}

function handleScan(val) {
  if (!scanTarget) return;
  const el = document.getElementById(scanTarget);
  if (el) {
    el.value = val;
    el.dispatchEvent(new Event('input'));
  }
  // Auto-trigger relevant actions
  if (scanTarget === 'hyl-ean') searchProduct();
  if (scanTarget === 'hyl-shelf') { /* user will save manually */ }
  if (scanTarget === 'pick-ean') { /* user will add manually */ }
  if (scanTarget && scanTarget.startsWith('confirm-')) {
    const step = scanTarget.replace('confirm-', '');
    handleConfirmScan(step, val);
  }
  if (scanCallback) scanCallback(val);
}

// ─── HYLLYTYS ─────────────────────────────────────────────────────────────────
function searchProduct() {
  const raw = document.getElementById('hyl-ean').value.trim();
  if (!raw) { toast('Syötä EAN tai tuotekoodi', 'err'); return; }

  const shelves = DB.getShelves();
  const resultDiv = document.getElementById('hyl-product-result');
  const formDiv = document.getElementById('hyl-form');

  const found = DB.findProduct(raw);

  if (!found) {
    // Tuntematon — näytetään rekisteröintilomake
    // Syöte voi olla EAN (numerot) tai tuotekoodi (kirjaimia) — yritetään päätellä
    const looksLikeEAN = /^\d{8,14}$/.test(raw);
    resultDiv.innerHTML = `
      <div class="card" style="border-color:var(--yellow)">
        <div class="card-title" style="color:var(--yellow)">⚠ Tuntematon nimike</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px">
          Koodi <code style="color:var(--accent)">${raw}</code> ei löydy rekisteristä. Lisää nimikkeen tiedot:
        </p>
        <label>EAN-viivakoodi</label>
        <div class="scan-row" style="margin-bottom:8px">
          <input type="text" id="new-ean" placeholder="esim. 6234567890123"
            value="${looksLikeEAN ? raw : ''}" autocomplete="off">
          <button class="btn-scan" onclick="openScanner('new-ean','Skannaa EAN tuotteesta')">⊡</button>
        </div>
        <label>Tuotekoodi (Lemonsoft)</label>
        <input type="text" id="new-code" placeholder="esim. 531526"
          value="${!looksLikeEAN ? raw : ''}" style="margin-bottom:8px;text-transform:uppercase" autocomplete="off">
        <label>Tuotteen nimi</label>
        <input type="text" id="new-name" placeholder="esim. imuturbiini VCE26 H MC" style="margin-bottom:12px" autocomplete="off">
        <button class="btn btn-primary" onclick="registerNewProduct()">Rekisteröi nimike</button>
      </div>`;
    resultDiv.style.display = '';
    formDiv.style.display = 'none';
    return;
  }

  // Päivitä kentän arvo EAN:ksi jotta saveShelfEntry toimii oikein
  document.getElementById('hyl-ean').value = found.ean;
  showProductResult(found.ean, found.product, shelves);
}

function registerNewProduct() {
  const ean  = document.getElementById('new-ean').value.trim();
  const code = document.getElementById('new-code').value.trim().toUpperCase();
  const name = document.getElementById('new-name').value.trim();
  if (!ean)  { toast('Syötä EAN-viivakoodi', 'err'); return; }
  if (!name) { toast('Anna tuotteen nimi', 'err'); return; }
  // Tarkista että EAN ei ole jo käytössä toisella nimikkeellä
  const existing = DB.findProduct(ean);
  if (existing && existing.ean !== ean) {
    toast('EAN on jo käytössä toisella nimikkeellä', 'err'); return;
  }
  const product = { ean, code, name };
  DB.saveProduct(ean, product);
  document.getElementById('hyl-ean').value = ean;
  const shelves = DB.getShelves();
  showProductResult(ean, product, shelves);
  toast('Nimike rekisteröity', 'ok');
}

function showProductResult(ean, product, shelves) {
  const shelfData = shelves[ean] || {};
  const total = Object.values(shelfData).reduce((a, b) => a + b, 0);
  const entries = Object.entries(shelfData).sort((a, b) => b[1] - a[1]);

  const shelvesHtml = entries.length === 0
    ? `<p style="color:var(--muted);font-size:13px">Ei hyllytietoja — lisää alla</p>`
    : entries.map(([sc, qty]) => `
        <div class="shelf-row">
          <div class="shelf-code">${sc}</div>
          <div style="flex:1"></div>
          <div class="shelf-qty">${qty}</div>
          <div class="shelf-unit" style="margin-right:8px">kpl</div>
          <div class="shelf-actions">
            <button class="btn btn-secondary btn-sm" onclick="editShelfQty('${ean}','${sc}')">✏</button>
            <button class="btn btn-sm" style="background:rgba(231,76,60,.15);color:var(--red)" onclick="removeShelf('${ean}','${sc}')">✕</button>
          </div>
        </div>`).join('');

  const codeLine = [
    product.code ? `<span style="color:var(--accent)">Koodi: ${product.code}</span>` : '',
    ean ? `EAN: ${ean}` : '',
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');

  document.getElementById('hyl-product-result').innerHTML = `
    <div class="product-card">
      <div class="product-name">${product.name}</div>
      <div class="product-code">${codeLine}</div>
      <div class="total-badge">
        ${total} <span>kpl yhteensä</span>
      </div>
      <div class="card-title">Hyllypaikat</div>
      ${shelvesHtml}
    </div>`;
  document.getElementById('hyl-product-result').style.display = '';
  document.getElementById('hyl-form').style.display = '';
  document.getElementById('hyl-shelf').value = '';
  document.getElementById('hyl-qty').value = '1';
  document.getElementById('hyl-shelf').focus();
}

function saveShelfEntry() {
  const ean = document.getElementById('hyl-ean').value.trim();
  const shelf = document.getElementById('hyl-shelf').value.trim().toUpperCase();
  const qty = parseInt(document.getElementById('hyl-qty').value) || 0;
  if (!ean) { toast('Hae tuote ensin', 'err'); return; }
  if (!shelf) { toast('Syötä hyllypaikka', 'err'); return; }
  if (qty < 0) { toast('Määrä ei voi olla negatiivinen', 'err'); return; }

  const shelves = DB.getShelves();
  if (!shelves[ean]) shelves[ean] = {};
  shelves[ean][shelf] = qty;
  if (qty === 0) delete shelves[ean][shelf];
  DB.saveShelves(shelves);

  const products = DB.getProducts();
  showProductResult(ean, products[ean], shelves);
  toast(`${shelf} → ${qty} kpl tallennettu`, 'ok');
  document.getElementById('hyl-shelf').value = '';
  document.getElementById('hyl-qty').value = '1';
}

function editShelfQty(ean, shelf) {
  const shelves = DB.getShelves();
  const current = (shelves[ean] || {})[shelf] || 0;
  const newQty = prompt(`Hyllypaikka ${shelf} — uusi saldo (nykyinen: ${current}):`, current);
  if (newQty === null) return;
  const qty = parseInt(newQty);
  if (isNaN(qty) || qty < 0) { toast('Virheellinen arvo', 'err'); return; }
  if (!shelves[ean]) shelves[ean] = {};
  shelves[ean][shelf] = qty;
  if (qty === 0) delete shelves[ean][shelf];
  DB.saveShelves(shelves);
  const products = DB.getProducts();
  showProductResult(ean, products[ean], shelves);
  toast('Saldo päivitetty', 'ok');
}

function removeShelf(ean, shelf) {
  if (!confirm(`Poista hyllypaikka ${shelf}?`)) return;
  const shelves = DB.getShelves();
  if (shelves[ean]) delete shelves[ean][shelf];
  DB.saveShelves(shelves);
  const products = DB.getProducts();
  showProductResult(ean, products[ean], shelves);
  toast('Hyllypaikka poistettu', 'ok');
}

// ─── KERÄILY ──────────────────────────────────────────────────────────────────
let currentConfirmStep = null; // null | 'shelf' | 'product'
let currentConfirmRowIdx = null;

function startNewList() {
  DB.savePickList([]);
  document.getElementById('pick-setup').style.display = 'none';
  document.getElementById('pick-active').style.display = '';
  renderPickRows();
  updateBadge();
}

function clearPickList() {
  if (!confirm('Lopeta keräilylista? Kaikki merkinnät tyhjennetään.')) return;
  DB.savePickList([]);
  document.getElementById('pick-setup').style.display = '';
  document.getElementById('pick-active').style.display = 'none';
  document.getElementById('pick-confirm-area').style.display = 'none';
  updateBadge();
}

function addPickRow() {
  const raw = document.getElementById('pick-ean').value.trim();
  const needed = parseInt(document.getElementById('pick-need-qty').value) || 1;
  if (!raw) { toast('Skannaa tai syötä koodi', 'err'); return; }

  const shelves = DB.getShelves();
  const found = DB.findProduct(raw);
  const ean = found ? found.ean : raw;
  const product = found ? found.product : null;
  const shelfData = shelves[ean] || {};

  // Build shelf allocation (largest first)
  const entries = Object.entries(shelfData).sort((a, b) => b[1] - a[1]);
  let remaining = needed;
  const alloc = entries.map(([sc, avail]) => {
    const take = Math.min(avail, remaining);
    remaining -= take;
    return { code: sc, available: avail, toTake: take };
  }).filter(s => s.toTake > 0);

  const list = DB.getPickList();
  list.push({
    ean,
    name: product ? product.name : `Tuntematon (${raw})`,
    code: product ? product.code : raw,
    needed,
    shelves: alloc,
    done: false,
    idx: list.length,
  });
  DB.savePickList(list);

  document.getElementById('pick-ean').value = '';
  document.getElementById('pick-need-qty').value = '1';
  renderPickRows();
  updateBadge();

  if (!product) {
    toast('⚠ Nimike tuntematon — lisää Hyllytys-välilehdellä', 'err');
  } else if (remaining > 0) {
    toast(`⚠ Saldo vajaa — puuttuu ${remaining} kpl`, 'err');
  } else if (alloc.length === 0) {
    toast('Hyllypaikka puuttuu — aseta Hyllytys-välilehdellä', '');
  } else {
    toast('Rivi lisätty', 'ok');
  }
}

function renderPickRows() {
  const list = DB.getPickList();
  const container = document.getElementById('pick-rows');
  if (!container) return;

  if (list.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><p>Ei rivejä.<br>Skannaa tuotekoodi tai EAN lähetteeltä.</p></div>`;
    document.getElementById('pick-confirm-area').style.display = 'none';
    return;
  }

  const done = list.filter(r => r.done).length;
  document.getElementById('pick-progress-label').textContent = `${done}/${list.length} kerätty`;

  container.innerHTML = list.map((row, i) => {
    const statusTag = row.done
      ? `<span class="tag tag-ok">✓ Kerätty</span>`
      : row.shelves.length === 0
        ? `<span class="tag tag-err">Hyllypaikka puuttuu</span>`
        : `<span class="tag tag-wait">Odottaa</span>`;

    const shelvesHtml = row.shelves.length === 0
      ? `<p style="font-size:12px;color:var(--muted);margin-top:6px">⚠ Aseta hyllypaikka Hyllytys-välilehdellä</p>`
      : row.shelves.length === 1
        ? `<div class="pick-location">${row.shelves[0].code}</div>`
        : `<div class="multi-shelf">
            ${row.shelves.map(s => `
              <div class="multi-shelf-row">
                <div class="shelf-code">${s.code}</div>
                <div class="shelf-qty">${s.toTake}</div>
                <div class="shelf-unit">kpl</div>
              </div>`).join('')}
          </div>`;

    const actionBtn = !row.done && row.shelves.length > 0
      ? `<button class="btn btn-primary" style="margin-top:10px" onclick="startConfirm(${i})">
           ⊡ Vahvista keräily
         </button>`
      : row.done
        ? `<button class="btn btn-secondary" style="margin-top:10px;font-size:12px" onclick="undoPick(${i})">
             ↩ Peruuta</button>`
        : '';

    return `
      <div class="pick-row ${row.done ? 'done' : ''}" id="pick-row-${i}">
        <div class="pick-header">
          <div class="pick-num">#${i+1}</div>
          <div class="pick-name">${row.name}${row.code ? ` <span style="color:var(--muted);font-size:11px">${row.code}</span>` : ''}</div>
          ${statusTag}
        </div>
        <div class="pick-qty-row">
          <div class="qty-needed">${row.needed}</div>
          <div class="qty-label">kpl kerättävä</div>
        </div>
        ${shelvesHtml}
        ${actionBtn}
      </div>`;
  }).join('');
}

function startConfirm(rowIdx) {
  currentConfirmRowIdx = rowIdx;
  currentConfirmStep = 'shelf';
  const list = DB.getPickList();
  const row = list[rowIdx];
  const area = document.getElementById('pick-confirm-area');
  const inner = document.getElementById('pick-confirm-inner');

  const shelfTarget = row.shelves[0].code;

  inner.innerHTML = `
    <div class="confirm-box">
      <div class="step">Vaihe 1/2 — Vahvista hyllypaikka</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px">
        Mene hyllylle <strong style="color:var(--accent)">${shelfTarget}</strong> ja skannaa hyllypaikan QR-koodi.
      </p>
      <div class="scan-row">
        <input type="text" id="confirm-shelf-input" placeholder="${shelfTarget}" autocomplete="off" style="text-transform:uppercase">
        <button class="btn-scan" onclick="openScanner('confirm-shelf', 'Skannaa hyllypaikan QR: ${shelfTarget}')">⊡</button>
      </div>
      <div style="margin-top:8px">
        <button class="btn btn-primary" onclick="checkConfirmShelf()">Vahvista →</button>
      </div>
    </div>`;

  area.style.display = '';
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function handleConfirmScan(step, val) {
  if (step === 'shelf') {
    document.getElementById('confirm-shelf-input').value = val.toUpperCase();
    checkConfirmShelf();
  } else if (step === 'product') {
    document.getElementById('confirm-product-input').value = val;
    checkConfirmProduct();
  }
}

function checkConfirmShelf() {
  const list = DB.getPickList();
  const row = list[currentConfirmRowIdx];
  const input = document.getElementById('confirm-shelf-input').value.trim().toUpperCase();
  const expected = row.shelves[0].code.toUpperCase();

  const inner = document.getElementById('pick-confirm-inner');

  if (input !== expected) {
    inner.querySelector('.confirm-box').insertAdjacentHTML('beforeend',
      `<div class="confirm-result err">❌ Väärä hyllypaikka — odotetaan ${expected}</div>`);
    return;
  }

  // Step 2 — scan product
  currentConfirmStep = 'product';
  const codeHint = row.code ? ` tai tuotekoodi <strong style="color:var(--accent)">${row.code}</strong>` : '';
  inner.innerHTML = `
    <div class="confirm-box">
      <div class="step">Vaihe 2/2 — Vahvista tuote</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px">
        Skannaa tuotteen EAN${codeHint}.
      </p>
      <div class="scan-row">
        <input type="text" id="confirm-product-input" placeholder="${row.ean}" autocomplete="off">
        <button class="btn-scan" onclick="openScanner('confirm-product', 'Skannaa tuotteen EAN tai koodi')">⊡</button>
      </div>
      <div style="margin-top:8px">
        <button class="btn btn-primary" onclick="checkConfirmProduct()">Vahvista →</button>
      </div>
    </div>`;
}

function checkConfirmProduct() {
  const list = DB.getPickList();
  const row = list[currentConfirmRowIdx];
  const input = document.getElementById('confirm-product-input').value.trim();
  const inner = document.getElementById('pick-confirm-inner');

  // Hyväksy sekä EAN että tuotekoodi
  const found = DB.findProduct(input);
  const matchesEAN = input === row.ean;
  const matchesCode = found && found.ean === row.ean;

  if (!matchesEAN && !matchesCode) {
    // Poista aiemmat virheilmoitukset ensin
    inner.querySelectorAll('.confirm-result.err').forEach(e => e.remove());
    inner.querySelector('.confirm-box').insertAdjacentHTML('beforeend',
      `<div class="confirm-result err">❌ Väärä tuote — tarkista koodi</div>`);
    return;
  }

  // SUCCESS — mark done, reduce shelf qtys
  list[currentConfirmRowIdx].done = true;
  const shelves = DB.getShelves();
  row.shelves.forEach(s => {
    if (shelves[row.ean] && shelves[row.ean][s.code] !== undefined) {
      shelves[row.ean][s.code] = Math.max(0, shelves[row.ean][s.code] - s.toTake);
      if (shelves[row.ean][s.code] === 0) delete shelves[row.ean][s.code];
    }
  });
  DB.saveShelves(shelves);
  DB.savePickList(list);

  document.getElementById('pick-confirm-area').style.display = 'none';
  currentConfirmRowIdx = null;
  currentConfirmStep = null;
  renderPickRows();
  updateBadge();

  const allDone = list.every(r => r.done);
  if (allDone) {
    toast('🎉 Kaikki kerätty!', 'ok');
  } else {
    toast('✓ Kerätty — saldo päivitetty', 'ok');
  }
}

function undoPick(rowIdx) {
  const list = DB.getPickList();
  list[rowIdx].done = false;
  DB.savePickList(list);
  renderPickRows();
  updateBadge();
}

// ─── REKISTERI ────────────────────────────────────────────────────────────────
function renderRegistry() {
  const products = DB.getProducts();
  const shelves = DB.getShelves();
  const q = (document.getElementById('reg-search')?.value || '').toLowerCase();
  const container = document.getElementById('registry-list');

  const entries = Object.values(products).filter(p => {
    if (!q) return true;
    return p.name.toLowerCase().includes(q)
      || p.code.toLowerCase().includes(q)
      || p.ean.toLowerCase().includes(q)
      || Object.keys(shelves[p.ean] || {}).some(s => s.toLowerCase().includes(q));
  }).sort((a, b) => a.name.localeCompare(b.name, 'fi'));

  if (entries.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🗂</div>
      <p>${q ? 'Ei tuloksia haulle "' + q + '"' : 'Rekisteri on tyhjä.<br>Lisää tuotteita Hyllytys-välilehdellä.'}</p></div>`;
    return;
  }

  container.innerHTML = entries.map(p => {
    const shelfData = shelves[p.ean] || {};
    const total = Object.values(shelfData).reduce((a, b) => a + b, 0);
    const shelfEntries = Object.entries(shelfData).sort((a, b) => b[1] - a[1]);

    const shelvesHtml = shelfEntries.length === 0
      ? `<span style="color:var(--muted);font-size:12px">Ei hyllytietoja</span>`
      : shelfEntries.map(([sc, qty]) =>
          `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--surface2);
            border:1px solid var(--border);border-radius:6px;padding:4px 10px;margin:2px;font-size:13px">
            <span style="font-family:var(--mono);color:var(--accent);font-weight:700">${sc}</span>
            <span style="color:var(--muted)">·</span>
            <span style="font-family:var(--mono);font-weight:900">${qty}</span>
            <span style="font-size:11px;color:var(--muted)">kpl</span>
          </span>`).join('');

    return `
      <div class="reg-item">
        <div class="reg-name">${p.name}</div>
        <div class="reg-code">${p.code ? p.code + ' · ' : ''}EAN: ${p.ean}</div>
        <div style="margin-bottom:8px">
          <span style="font-size:12px;color:var(--muted)">Yhteensä: </span>
          <span style="font-family:var(--mono);font-weight:900;color:var(--accent)">${total} kpl</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:10px">${shelvesHtml}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="showPage('hyllytys');document.getElementById('hyl-ean').value='${p.ean}';searchProduct()">
            ✏ Muokkaa
          </button>
          <button class="btn btn-sm" style="background:rgba(231,76,60,.1);color:var(--red)" onclick="deleteProduct('${p.ean}')">
            🗑 Poista
          </button>
        </div>
      </div>`;
  }).join('');
}

function deleteProduct(ean) {
  const products = DB.getProducts();
  const name = products[ean]?.name || ean;
  if (!confirm(`Poista "${name}" rekisteristä?\nHyllytiedot poistetaan myös.`)) return;
  DB.deleteProduct(ean);
  renderRegistry();
  toast('Nimike poistettu', 'ok');
}

// ─── CSV ──────────────────────────────────────────────────────────────────────
function exportCSV() {
  const products = DB.getProducts();
  const shelves = DB.getShelves();
  const rows = [['EAN','Koodi','Nimi','Hyllypaikka','Saldo']];
  Object.values(products).forEach(p => {
    const shelfData = shelves[p.ean] || {};
    if (Object.keys(shelfData).length === 0) {
      rows.push([p.ean, p.code, p.name, '', '']);
    } else {
      Object.entries(shelfData).forEach(([sc, qty]) => {
        rows.push([p.ean, p.code, p.name, sc, qty]);
      });
    }
  });
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tt-keraily-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  toast('CSV viety', 'ok');
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result.replace(/^\uFEFF/, '');
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { toast('CSV tyhjä tai virheellinen', 'err'); return; }
    const products = DB.getProducts();
    const shelves = DB.getShelves();
    const idx = DB.getCodeIndex();
    let count = 0;
    lines.slice(1).forEach(line => {
      const cols = line.split(',').map(c => c.replace(/^"|"$/g,'').replace(/""/g,'"').trim());
      const [ean, code, name, shelf, qty] = cols;
      if (!ean) return;
      if (name) {
        products[ean] = { ean, code: code||'', name };
        if (code) idx[code.toUpperCase()] = ean;
      }
      if (shelf && qty !== '') {
        if (!shelves[ean]) shelves[ean] = {};
        shelves[ean][shelf] = parseInt(qty) || 0;
      }
      count++;
    });
    DB.saveProducts(products);
    DB.saveShelves(shelves);
    DB.saveCodeIndex(idx);
    renderRegistry();
    toast(`${count} riviä tuotu`, 'ok');
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(function init() {
  // Restore pick list state
  const list = DB.getPickList();
  if (list.length > 0) {
    document.getElementById('pick-setup').style.display = 'none';
    document.getElementById('pick-active').style.display = '';
    renderPickRows();
  }
  updateBadge();

  // Listen for enter on inputs
  ['hyl-ean'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') searchProduct(); });
  });
  document.getElementById('hyl-shelf')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('hyl-qty')?.focus();
  });
  document.getElementById('hyl-qty')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') saveShelfEntry();
  });
})();
</script>
